name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy
    - name: Verify Model Architecture
      run: |
        python -c "import torch; from src.models.yield_net import SpatioTemporalYieldNet; m = SpatioTemporalYieldNet(); x = torch.randn(2, 12, 5); y, f = m(x); assert y.shape == (2, 1); print('Architecture sanity test passed!')"
